name: 部署雲端推播

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-push.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 檢查金鑰
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::還沒設定 CLOUDFLARE_API_TOKEN，請到 Settings → Secrets and variables → Actions 新增"
            exit 1
          fi
      - name: 準備 KV 儲存空間
        working-directory: worker
        run: |
          npm i -g wrangler@3.114.0 >/dev/null
          ID=$(wrangler kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>x.title==="mobile-secretary-push-MS_KV"||x.title==="mobile-secretary-kv");console.log(n?n.id:"")})')
          if [ -z "$ID" ]; then
            wrangler kv namespace create mobile-secretary-kv | tee out.txt
            ID=$(grep -oE '[0-9a-f]{32}' out.txt | head -1)
          fi
          echo "KV id: $ID"
          sed -i "s/KV_ID_PLACEHOLDER/$ID/" wrangler.toml
      - name: 部署 Worker
        working-directory: worker
        run: |
          wrangler deploy | tee deploy.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.txt | head -1)
          if [ -z "$URL" ]; then echo "::error::找不到 workers.dev 網址，請先到 Cloudflare 後台 Workers 頁面設定 workers.dev 子網域"; exit 1; fi
          echo "URL=$URL" >> $GITHUB_ENV
      - name: 把推播網址寫進網站
        run: |
          echo "window.PUSH_API = '${URL}';" > push-config.js
          if ! git diff --quiet -- push-config.js 2>/dev/null || [ -n "$(git status --porcelain push-config.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add push-config.js
            git commit -m "更新雲端推播網址"
            git push
          fi
